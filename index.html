<style>
:root { color-scheme: dark; --bg: #0f1218; --card: #161a23; --line: #2a2e39; --tx: #d1d4dc; --dim: #9aa0ab; --accent: #b8382a; --white: #fff }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--tx); font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif; line-height: 1.7 }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 40px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 24px }
header { display: flex; align-items: center; gap: 14px }
.seal { width: 52px; height: 52px; border: 3px solid var(--accent); border-radius: 7px; display: grid; grid-template-columns: 1fr 1fr; font-family: "Shippori Mincho B1", serif; font-weight: 800; font-size: 19px; line-height: 1; overflow: hidden }
.seal span { display: flex; align-items: center; justify-content: center }
.r { background: var(--accent); color: #fff } .w { background: #fff; color: var(--accent) }
h1 { margin: 0; font-family: "Shippori Mincho B1", serif; font-size: 28px; color: var(--white); letter-spacing: .04em }
p { margin: 0 }
.lead { color: var(--dim) }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px }
a.card { display: grid; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; color: var(--tx); text-decoration: none }
a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none }
a.card b { color: var(--white); font-size: 18px }
a.card span { font-size: 13.5px; color: var(--dim) }
a.card em { font-style: normal; font-size: 13px; color: #ff8a7a }
.card.soon { display: grid; gap: 6px; align-content: start; background: transparent; border: 1px dashed var(--line); border-radius: 12px; padding: 18px 20px; color: var(--dim) }
.card.soon b { color: var(--dim); font-size: 18px }
.foot { font-size: 12px; color: var(--dim); border-top: 1px solid var(--line); padding-top: 14px }
</style>
</head>

    <h1>四象ラボ　デモ</h1>
  </header>
  <p class="lead">四象ラボのツールを、架空の銘柄・値動きでお試しいただけるページです。ブラウザで開くだけで動きます。データの入力や送信はありません。</p>
  <div class="cards">
    <a class="card" href="board.html"><b>テーマ別株価ボード</b><span>TradingViewのチャートの上に出す表のデモ。同じテーマの39銘柄の、トレンド（Gann）・移動平均のクロス・β・出来高・TOPIXとの比較を1枚で。テーマ・並べ替えを変えられます。</span><em>開く →</em></a>
    <div class="card soon"><b>4象限マップ</b><span>準備中です。</span></div>
  </div>
  <p class="foot">銘柄名・数値はすべて架空です。特定の銘柄の売買をすすめるものではありません。TradingViewは TradingView, Inc. の商標です。　© 四象ラボ</p>
</div>
